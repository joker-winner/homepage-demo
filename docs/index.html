<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8f5"><title>酒业年报问答 · 2024</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%231d624e'/%3E%3Cpath d='M14 8h12v4H14zm2 4h8l1 9 7 9c2 3 0 6-3 6H11c-3 0-5-3-3-6l7-9z' fill='%23f4cf83'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--ink:#16352f;--muted:#687b74;--green:#1d624e;--line:#e4ebe5;--paper:#fff;--bg:#f7f8f5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(850px 420px at 90% 0,#e2efe9 0,transparent 65%),var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif}.wrap{max-width:1080px;margin:0 auto;padding:54px 24px 72px}.eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#608077;font-weight:750}.hero{font-size:clamp(36px,6vw,54px);line-height:1.13;letter-spacing:-.045em;margin:13px 0;color:#143c32}.sub{max-width:760px;font-size:16px;line-height:1.8;color:#61746f}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0 24px}.metric,.panel,.source{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 20px #254a3b08}.metric{padding:17px 19px}.metric strong{display:block;font-size:23px;color:#19493c}.metric span{font-size:12px;color:#71817a}.panel{padding:23px;margin:18px 0}.form{display:flex;gap:10px}.form input{flex:1;min-width:0;padding:15px 16px;border:1px solid #dfe7e0;border-radius:11px;font-size:15px;outline:none;background:#fff;color:var(--ink)}.form input:focus{border-color:#6ba58f;box-shadow:0 0 0 3px #2c8a6718}button{background:var(--green);color:#fff;border:0;border-radius:11px;padding:0 22px;font-size:14px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.hint{font-size:12px;color:#81918a;margin:13px 0 0}.status{padding:12px 14px;background:#edf5f0;color:#39725f;border-radius:10px;margin:16px 0;font-size:13px}.status.error{background:#fff3e9;color:#955b29}.answer{margin:22px 0 10px;font-weight:750;font-size:20px}.source{padding:17px 19px;margin:11px 0}.tag{display:inline-block;border-radius:99px;background:#eaf4ee;color:#39725f;padding:4px 10px;font-size:11px;margin:0 5px 5px 0}.body{white-space:pre-wrap;line-height:1.8;color:#273d36;margin:10px 0 12px;font-size:14px;overflow-wrap:anywhere}.source a{color:#27765a;text-decoration:none;font-size:12px;font-weight:650}.score{float:right;color:#82918a;font-size:11px}.foot{padding:22px 4px 0;color:#71817a;font-size:12px;line-height:1.8}h2{font-size:17px;margin:0 0 12px}@media(max-width:650px){.wrap{padding:34px 16px}.metrics{grid-template-columns:repeat(2,1fr)}.form{flex-direction:column}.form button{padding:14px}}
</style></head>
<body><main class="wrap">
<div class="eyebrow">上市公司披露 · 2024 年报告</div><h1 class="hero">一问，读懂十家酒企年报。</h1><p class="sub">围绕沪深上市酒类公司 2024 年年度报告，结合字符向量相似度与 BM25 关键词检索。每条证据都附公司、章节、页码与原报告链接，便于核对。</p>
<section class="metrics"><div class="metric"><strong id="companyCount">—</strong><span>报告公司</span></div><div class="metric"><strong id="chunkCount">加载中</strong><span>证据切块</span></div><div class="metric"><strong>BM25 + 向量</strong><span>混合检索</span></div><div class="metric"><strong>页码可追溯</strong><span>出处形式</span></div></section>
<section class="panel"><h2>问年报</h2><form class="form" id="ask"><input id="query" autocomplete="off" placeholder="例如：哪些公司提到线上渠道增长？请比较青岛啤酒和燕京啤酒。" aria-label="输入年报问题"><button id="submit" type="submit">检索年报</button></form><p class="hint">支持单公司问题与跨公司比较。结果来自报告原文检索，不会补写报告中没有的事实。</p><div id="status" class="status">正在载入年报索引…</div></section>
<section id="results" aria-live="polite"></section>
<div class="foot">样本为十家沪深酒类上市公司。报告按 PDF 页面提取，表格尽量按行列还原；每块保留公司、章节、PDF 页码和来源链接。此页面用于课程演示，关键数字请点击原报告复核。</div>
</main>
<script>
const base='data/processed/';let docs=[],prepared=[];const statusEl=document.querySelector('#status'),button=document.querySelector('#submit');
function terms(s){const out=[];for(const run of (s||'').toLowerCase().match(/[\u4e00-\u9fff]+|[A-Za-z0-9.%+-]+/g)||[]){if(/^[\u4e00-\u9fff]+$/.test(run)){for(let i=0;i<Math.max(1,run.length-1);i++)out.push(run.slice(i,i+2))}else out.push(run)}return out}
async function loadIndex(){if(!('DecompressionStream'in window))throw new Error('当前浏览器不支持索引解压，请换用新版 Chrome、Edge 或 Safari。');for(let i=0;i<9;i++){const name=`chunks-${String(i).padStart(2,'0')}.jsonl.gz`;const response=await fetch(base+name);if(!response.ok)throw new Error(`索引分片载入失败：${name}`);const stream=response.body.pipeThrough(new DecompressionStream('gzip'));const text=await new Response(stream).text();for(const line of text.split('\n'))if(line.trim())docs.push(JSON.parse(line))}prepared=docs.filter(d=>!['请问公司','您好！我来自','谢谢关注','投资者您好'].some(x=>(d.text||'').includes(x))).map(d=>{const t=terms(d.text);return{d,t,tf:new Map()}});for(const x of prepared)for(const t of x.t)x.tf.set(t,(x.tf.get(t)||0)+1);document.querySelector('#companyCount').textContent=new Set(docs.map(d=>d.company)).size;document.querySelector('#chunkCount').textContent=docs.length.toLocaleString();statusEl.textContent=`索引已就绪：${docs.length.toLocaleString()} 个证据块，可开始提问。`}
function search(query,topK=6,balanced=false){const q=terms(query),qv=new Map();for(const t of q)qv.set(t,(qv.get(t)||0)+1);const qnorm=Math.sqrt([...qv.values()].reduce((a,x)=>a+x*x,0))||1;const df=new Map();for(const x of prepared)for(const t of new Set(x.t))df.set(t,(df.get(t)||0)+1);const n=prepared.length,avg=prepared.reduce((a,x)=>a+x.t.length,0)/Math.max(n,1);let rows=[];for(const x of prepared){let b=0,dot=0,sq=0;for(const [t,count] of qv){const tf=x.tf.get(t)||0;if(!tf)continue;const idf=Math.log(1+(n-(df.get(t)||0)+.5)/((df.get(t)||0)+.5));b+=idf*tf*2.2/(tf+1.2*(.25+.75*x.t.length/Math.max(avg,1)));dot+=count*tf}for(const v of x.tf.values())sq+=v*v;const v=dot/(qnorm*(Math.sqrt(sq)||1));if(b||v)rows.push({d:x.d,b,v})}const mb=Math.max(0,...rows.map(x=>x.b)),mv=Math.max(0,...rows.map(x=>x.v));rows=rows.map(x=>({...x,score:.6*(mb?x.b/mb:0)+.4*(mv?x.v/mv:0)})).sort((a,b)=>b.score-a.score);if(!balanced)return rows.slice(0,topK).map(x=>({...x.d,score:x.score}));const by=new Map();for(const x of rows){const c=x.d.company;if(!by.has(c))by.set(c,[]);by.get(c).push(x)}const out=[];for(const c of ['青岛啤酒','燕京啤酒'])if(by.has(c)&&by.get(c).length&&out.length<topK)out.push(by.get(c).shift());while(out.length<topK&&[...by.values()].some(a=>a.length))for(const a of by.values())if(a.length&&out.length<topK)out.push(a.shift());return out.map(x=>({...x.d,score:x.score}))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelector('#ask').addEventListener('submit',e=>{e.preventDefault();const q=document.querySelector('#query').value.trim();if(!q)return;if(!docs.length){statusEl.className='status error';statusEl.textContent='索引还未载入，请稍后重试或刷新页面。';return}button.disabled=true;button.textContent='检索中…';try{const broad=['比较','哪些公司','分别','跨公司','两家公司'].some(k=>q.includes(k));const hits=search(q,6,broad);const root=document.querySelector('#results');if(!hits.length){root.innerHTML='<div class="answer">没有检索到相关报告证据</div>';return}root.innerHTML='<h2 class="answer">检索到的年报证据</h2>'+hits.map(h=>`<article class="source"><span class="tag">${esc(h.company)}</span><span class="tag">${esc(h.section||'未标章节')}</span><span class="tag">第 ${esc(h.page??'?')} 页</span><span class="score">混合得分 ${h.score.toFixed(3)}</span><div class="body">${esc((h.text||'').slice(0,1000))}</div><a href="${esc(h.source_url||'#')}" target="_blank" rel="noopener noreferrer">查看原始年报 ↗</a></article>`).join('');root.scrollIntoView({behavior:'smooth',block:'start'})}catch(err){statusEl.className='status error';statusEl.textContent='检索遇到问题：'+err.message}finally{button.disabled=false;button.textContent='检索年报'}});
loadIndex().catch(err=>{statusEl.className='status error';statusEl.textContent='索引未能载入：'+err.message});
</script></body></html>
